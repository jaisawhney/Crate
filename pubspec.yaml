name: crate
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_metadata_reader: ^1.8.1
  crypto: ^3.0.8
  diacritic: ^0.1.6
  dio: ^5.11.1
  ffmpeg_kit_extended_flutter: 0.6.2
  file_selector: ^1.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.0
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  just_audio: ^0.10.6
  just_audio_media_kit:
    git:
      url: https://github.com/jaisawhney/just_audio_media_kit.git
      ref: 5f8a0b846c9934c865a8cc53afd7df2e0e7db145
  material_ui: ^1.11.1
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  ml_linalg: ^13.12.9
  objectbox: 5.3.2
  objectbox_flutter_libs: 5.3.2
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  objectbox_generator: 5.3.2
  launcher_icons: 0.16.0

launcher_icons:
  image_path: assets/icon/crate.svg
  macos:
    generate: true
    padding: 10
  windows:
    generate: true
  linux:
    generate: true
    image_path: assets/icon/crate.linux.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

ffmpeg_kit_extended_config:
  type: "audio"
  gpl: false
  small: true

objectbox:
  output_dir: data/services/database
